name: Hamartia checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-backup-recovery:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend/tests -p test_backup.py -v
        env:
          PYTHONPATH: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm ci --ignore-scripts --prefix desktop
      - run: node --test desktop/tests/*.test.cjs
      - run: npm run build
        working-directory: frontend
      - run: npm run bench:clock
        working-directory: frontend
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:docs
        working-directory: frontend
      - run: npm run test:onboarding
        working-directory: frontend
      - run: npm run test:browser
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAMARTIA_SOCIAL_TEST_DATABASE_URL: postgresql://hamartia_test:hamartia_test_password@127.0.0.1:5432/hamartia_social_test
      HAMARTIA_SOCIAL_BENCHMARK_DATABASE_URL: postgresql://hamartia_test:hamartia_test_password@127.0.0.1:5432/hamartia_social_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hamartia_social_test
          POSTGRES_USER: hamartia_test
          POSTGRES_PASSWORD: hamartia_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hamartia_test -d hamartia_social_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip install -r backend/requirements-social.txt
      - run: python -m unittest discover -s backend/tests -v
        env:
          PYTHONPATH: backend
      - run: python backend/benchmarks/benchmark_study_agent_cli.py --repeats 3
        env:
          PYTHONPATH: backend
      - run: python backend/benchmarks/benchmark_study_agent_cli_records.py --repeats 3
        env:
          PYTHONPATH: backend
      - run: python backend/benchmarks/benchmark_social_profiles.py
        env:
          PYTHONPATH: backend
      - run: python backend/benchmarks/benchmark_social_forum.py
        env:
          PYTHONPATH: backend
      - run: python backend/benchmarks/benchmark_storage.py
        env:
          PYTHONPATH: backend
      - run: python backend/benchmarks/benchmark_questions.py
        env:
          PYTHONPATH: backend
      - run: python backend/benchmarks/benchmark_backup.py
        env:
          PYTHONPATH: backend
      - run: python backend/benchmarks/benchmark_question_order.py
        env:
          PYTHONPATH: backend
      - run: python backend/benchmarks/benchmark_practice_sessions.py
        env:
          PYTHONPATH: backend
      - run: python backend/benchmarks/benchmark_study_agent_practice.py --repeats 3
        env:
          PYTHONPATH: backend
      - run: python backend/benchmarks/benchmark_study_agent_learning_evidence.py --repeats 3
        env:
          PYTHONPATH: backend
      - run: python backend/benchmarks/benchmark_study_agent_question.py --repeats 3
        env:
          PYTHONPATH: backend
      - run: python backend/benchmarks/benchmark_study_agent_exam.py --repeats 3
        env:
          PYTHONPATH: backend
      - run: python backend/benchmarks/benchmark_mixed_workloads.py
        env:
          PYTHONPATH: backend
      - run: python backend/benchmarks/benchmark_exam_profiles.py --repeats 3
        env:
          PYTHONPATH: backend
      - run: python backend/benchmarks/benchmark_practice_profiles.py --repeats 3
        env:
          PYTHONPATH: backend
      - run: python backend/benchmarks/benchmark_clock_api.py
        env:
          PYTHONPATH: backend
      - run: python backend/benchmarks/benchmark_student_profile.py --repeats 3
        env:
          PYTHONPATH: backend
      - run: python backend/benchmarks/benchmark_system_resilience.py
        env:
          PYTHONPATH: backend
      - run: python scripts/benchmark_docs.py
