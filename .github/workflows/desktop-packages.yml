name: Desktop package builds

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'desktop/**'
      - 'desktop/smoke_backend.py'
      - '.github/scripts/release_metadata.py'
      - '.github/scripts/test_release_metadata.py'
      - '.github/scripts/linux-safe-storage-smoke.sh'
      - '.github/workflows/desktop-packages.yml'
      - '.github/workflows/release.yml'
      - 'RELEASES.md'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to package
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Build ${{ matrix.target }} packages
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: windows-2022
            target: windows
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --prefix frontend
      - run: npm ci --prefix desktop
      - run: python -m pip install -r backend/requirements-build.txt
      - run: npm test --prefix frontend
      - run: npm test --prefix desktop
      - if: matrix.target == 'linux'
        run: npm run bench:social-auth --prefix desktop
      - run: python .github/scripts/test_release_metadata.py
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb dbus-x11 dbus-daemon gnome-keyring
      - if: matrix.target == 'linux'
        run: npm run dist:linux --prefix desktop
      - if: matrix.target == 'windows'
        run: npm run dist:win --prefix desktop
      - run: python desktop/smoke_backend.py
      - run: python -m unittest discover -s backend/tests -p test_storage_process_lock.py -v
      - if: matrix.target == 'linux'
        run: bash .github/scripts/linux-safe-storage-smoke.sh protected desktop/dist/linux-unpacked
      - if: matrix.target == 'linux'
        run: bash .github/scripts/linux-safe-storage-smoke.sh rejected desktop/dist/linux-unpacked
      - if: matrix.target == 'windows'
        run: node desktop/smoke_electron.cjs desktop/dist/win-unpacked
      - name: Install, launch, and uninstall the NSIS installer
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem desktop/dist -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Windows NSIS installer was not generated.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'hamartia-nsis-smoke'
          $installAttempted = $false
          try {
            $installAttempted = $true
            $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "NSIS installer exited with $($install.ExitCode)." }
            $app = Get-ChildItem $installDir -Filter 'Hamartia.exe' -File -Recurse | Select-Object -First 1
            if (-not $app) { throw 'Installed Hamartia.exe was not found.' }
            node desktop/smoke_electron.cjs $app.FullName
            if ($LASTEXITCODE -ne 0) { throw "Installed Electron smoke exited with $LASTEXITCODE." }
          } finally {
            if ($installAttempted -and (Test-Path $installDir)) {
              $uninstaller = Get-ChildItem $installDir -Filter 'Uninstall Hamartia.exe' -File -Recurse | Select-Object -First 1
              if ($uninstaller) {
                $remove = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
                if ($remove.ExitCode -ne 0) { throw "NSIS uninstaller exited with $($remove.ExitCode)." }
                if (Test-Path $installDir) { throw 'NSIS uninstaller left files in the installation directory.' }
              } else {
                Remove-Item $installDir -Recurse -Force
                if (Test-Path $installDir) { throw 'Could not clean up the partial NSIS installation.' }
              }
            }
          }
      - name: Install, launch, and remove the Debian package
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          package_file="$(find desktop/dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$package_file"
          package_name="$(dpkg-deb --field "$package_file" Package)"
          cleanup() {
            status="$(dpkg-query -W -f='${Status}' "$package_name" 2>/dev/null || true)"
            if [[ "$status" == install\ ok\ * ]]; then
              sudo apt-get remove -y "$package_name"
              status="$(dpkg-query -W -f='${Status}' "$package_name" 2>/dev/null || true)"
              if [[ "$status" == install\ ok\ * ]]; then
                echo "Debian package $package_name remains installed after removal." >&2
                return 1
              fi
            fi
          }
          trap cleanup EXIT
          sudo apt-get install -y "$GITHUB_WORKSPACE/$package_file"
          executable="$(command -v hamartia-desktop || true)"
          test -n "$executable"
          test -x "$executable"
          executable="$(readlink -f "$executable")"
          test -f "$executable"
          test -x "$executable"
          bash .github/scripts/linux-safe-storage-smoke.sh protected "$executable"
      - name: Launch the AppImage
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find desktop/dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          test -x "$appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 bash .github/scripts/linux-safe-storage-smoke.sh protected "$GITHUB_WORKSPACE/$appimage"
      - if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: hamartia-linux
          path: |
            desktop/dist/*.deb
            desktop/dist/*.AppImage
          if-no-files-found: error
          retention-days: 14
      - if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: hamartia-windows
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
